[project]
name = "ollama-and-local-llm"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.85",
    "customtkinter>=6.0.0",
    "moto>=5.2.3",
    "ollama>=0.6.2",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "streamlit>=1.61.1",
]

[project.scripts]
ollama-and-local-llm = "ollama_and_local_llm:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "src/finance_analisys"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
